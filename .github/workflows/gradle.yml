name: Build NaN (Fabric 26.3)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Minecraft 26.3 and this project compile against Java 25.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # This repository currently has no Gradle Wrapper, so install a pinned
      # Gradle version and invoke `gradle` directly.
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Show build tool versions
        run: |
          java --version
          gradle --version

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Verify mod JAR was produced
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit | grep -q .

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: nan-fabric-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
